spring:
  application:
    name: saas-ecommerce

  datasource:
    url: jdbc:postgresql://localhost:5432/saas_ecommerce?TimeZone=Asia/Kolkata
    username: saas_user
    password: saas_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
open-in-view: false